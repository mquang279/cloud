#cloud-config
hostname: ${hostname}
manage_etc_hosts: true

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, admin
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: ubuntu

ssh_pwauth: true

chpasswd:
  expire: false

packages:
  - qemu-kvm
  - libvirt-daemon-system
  - libvirt-clients
  - virtinst
  - bridge-utils
  - cloud-image-utils
  - cpu-checker
  - openvswitch-switch
  - openvswitch-common

runcmd:
  - systemctl enable --now libvirtd || true
  - usermod -aG libvirt,kvm ubuntu || true